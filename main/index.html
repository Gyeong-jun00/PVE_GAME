<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boss Arena PvE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #111318;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .game-wrapper {
      position: relative;
      width: min(92vw, 960px);
      aspect-ratio: 16 / 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 10px;
      background-color: #1a1e26;
      border: 1px solid #2d3442;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background-color: rgba(17, 19, 24, 0.78);
      border-radius: 10px;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h1 {
      font-size: clamp(1.5rem, 3vw, 2.4rem);
    }

    .overlay p {
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    button {
      padding: 10px 22px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background-color: #3b82f6;
      color: #ffffff;
      cursor: pointer;
    }

    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <main class="game-wrapper">
    <!-- 내부 논리 해상도는 game.js에서 960x600 등으로 맞춰 사용 -->
    <canvas id="gameCanvas" width="960" height="600"></canvas>

    <!-- 시작 / 종료 오버레이 -->
    <section id="overlay" class="overlay" aria-live="polite">
      <h1 id="overlayTitle">BOSS ARENA</h1>
      <p id="overlayDesc">WASD 이동 · Space 대시 · 마우스 클릭 공격</p>
      <button id="actionBtn" type="button">전투 시작</button>
    </section>
  </main>

  <!-- ES Module 진입점 -->
  <script type="module" src="./js/game.js"></script>
</body>
</html>
